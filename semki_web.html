<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Семечки — Семечки</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0d14;
    color: #eef0f5;
    font-family: 'Montserrat', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  #game-container {
    position: relative;
    width: 100%;
    max-width: 540px;
    height: 100%;
    max-height: 920px;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at center, #131622 0%, #0b0d14 70%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 18px 8px;
    background: linear-gradient(to bottom, rgba(11,13,20,0.95), transparent);
    pointer-events: auto;
  }

  .score-block .score {
    font-size: 32px;
    font-weight: 800;
    color: #3fd9a8;
    text-shadow: 0 0 24px rgba(63,217,168,0.55);
    line-height: 1.1;
  }

  .combo {
    font-size: 15px;
    font-weight: 700;
    color: #ffc14d;
    text-shadow: 0 0 12px rgba(255,193,77,0.5);
    min-height: 20px;
  }

  .info {
    font-size: 13px;
    color: #8b90a0;
    text-align: right;
    line-height: 1.45;
  }

  .footer {
    margin-top: auto;
    padding: 10px 16px 22px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  button {
    flex: 1;
    border: none;
    border-radius: 16px;
    padding: 15px 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    color: white;
    cursor: pointer;
    transition: transform 0.12s, filter 0.15s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  button:active { transform: scale(0.95); }

  button::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.28), transparent);
    border-radius: 16px 16px 0 0;
    pointer-events: none;
  }

  .btn-hint   { background: linear-gradient(135deg, #2f3548, #1e2433); }
  .btn-append { background: linear-gradient(135deg, #2a5f96, #1a3f6e); }
  .btn-undo   { background: linear-gradient(135deg, #4a3f6b, #2e2848); }
  .btn-records { background: linear-gradient(135deg, #5b4a2a, #3d321c); }
  .btn-new    { background: linear-gradient(135deg, #3d7cff, #1d4ed8); }

  .status {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #a0a6b8;
    padding: 6px 12px;
    min-height: 28px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  /* Start Menu */
  #start-menu {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, #151826 0%, #0b0d14 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 24px;
  }

  #start-menu h1 {
    font-size: 52px;
    font-weight: 800;
    background: linear-gradient(135deg, #3fd9a8, #3d7cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }

  #start-menu .subtitle {
    color: #6b7280;
    margin-bottom: 32px;
    font-size: 15px;
  }

  input[type="text"] {
    width: 100%;
    max-width: 340px;
    padding: 15px 20px;
    border-radius: 16px;
    border: 2px solid #2a2f42;
    background: #161a27;
    color: white;
    font-size: 16px;
    font-family: inherit;
    margin-bottom: 22px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: #3d7cff; }

  .diff-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    width: 100%;
    max-width: 340px;
  }

  .diff-btn {
    flex: 1;
    padding: 13px 6px;
    border-radius: 14px;
    border: none;
    background: #1c2130;
    color: #9ca3af;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .diff-btn.active {
    background: linear-gradient(135deg, #3d7cff, #2563eb);
    color: white;
    box-shadow: 0 4px 18px rgba(61,124,255,0.4);
  }

  .start-btn {
    width: 100%;
    max-width: 340px;
    padding: 17px;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg, #3d7cff, #2563eb);
    color: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 6px 24px rgba(61,124,255,0.35);
    position: relative;
    overflow: hidden;
  }

  .start-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.25), transparent);
    border-radius: 18px 18px 0 0;
  }

  .hidden { display: none !important; }
</style>

<body>
  <div id="game-container">
    <canvas id="c"></canvas>

    <div class="ui-layer">
      <div class="header">
        <div class="score-block">
          <div class="score" id="score">0</div>
          <div class="combo" id="combo"></div>
        </div>
        <div class="info">
          <div id="moves">Ходы: 0</div>
          <div id="remain">Ост: 0</div>
        </div>
      </div>

      <div class="status" id="status">Удачи!</div>

      <div class="footer">
        <button class="btn-hint" id="btn-hint">Подсказка</button>
        <button class="btn-append" id="btn-append">Дописать</button>
        <button class="btn-undo" id="btn-undo">Назад</button>
        <button class="btn-records" id="btn-records">Рекорды</button>
        <button class="btn-new" id="btn-new">Новая</button>
      </div>
    </div>

    <div id="start-menu">
      <h1>СЕМЕЧКИ</h1>
      <div class="subtitle">Семечки</div>
      <input type="text" id="player-name" placeholder="Ваше имя" value="Игрок" maxlength="16">
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">Лёгкий</button>
        <button class="diff-btn active" data-diff="normal">Обычный</button>
        <button class="diff-btn" data-diff="hard">Сложный</button>
      </div>
      <button class="start-btn" id="btn-start">Начать игру</button>
    </div>
  
    <!-- Records Modal -->
    <div id="records-modal" class="hidden" style="position:absolute;inset:0;background:rgba(0,0,0,0.75);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#161a27;border-radius:20px;padding:24px;width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;">
        <h2 style="text-align:center;margin-bottom:16px;color:#3fd9a8;font-size:24px;">Рекорды</h2>
        <div id="records-list" style="flex:1;overflow-y:auto;margin-bottom:16px;font-size:14px;"></div>
        <button id="btn-close-records" style="padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#3d7cff,#2563eb);color:white;font-weight:700;cursor:pointer;">Закрыть</button>
      </div>
    </div>

  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const COLORS = {
  bg: '#0b0d14',
  card: '#1e2330',
  cardSelect: '#3d7cff',
  accent: '#3d7cff',
  accent2: '#3fd9a8',
  text: '#f0f2f7',
  muted: '#8b90a0',
  hint: '#34c759',
  combo: '#ffc14d'
};

// ---------- Sound (Web Audio) ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;

function ensureAudio() {
  if (!actx) actx = new AudioCtx();
}

function playTone(freq, type, dur, vol = 0.08) {
  try {
    ensureAudio();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch(e) {}
}

function sfxClick()  { playTone(420, 'sine', 0.06, 0.06); }
function sfxSuccess(){ playTone(580, 'triangle', 0.12, 0.09); playTone(880, 'sine', 0.15, 0.05); }
function sfxError()  { playTone(180, 'sawtooth', 0.12, 0.05); }
function sfxHint()   { playTone(660, 'sine', 0.1, 0.06); }

// ---------- Particles ----------
class Particle {
  constructor(x, y, color, force = 1) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = (2.5 + Math.random() * 7) * force;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - Math.random() * 3;
    this.life = 1;
    this.decay = 0.014 + Math.random() * 0.018;
    this.size = 3 + Math.random() * 7;
    this.color = color;
    this.rot = Math.random() * Math.PI * 2;
    this.vr = (Math.random() - 0.5) * 0.4;
    this.gravity = 0.18 + Math.random() * 0.1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.vx *= 0.96;
    this.life -= this.decay;
    this.rot += this.vr;
    this.size *= 0.975;
  }
  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
    ctx.restore();
  }
}

function spawnShatter(x, y, baseColor) {
  const palette = [baseColor, COLORS.accent, COLORS.accent2, '#ffffff', COLORS.hint, COLORS.combo];
  for (let i = 0; i < 22; i++) {
    state.particles.push(new Particle(x, y, palette[Math.floor(Math.random() * palette.length)], 1.1));
  }
}

// ---------- Floating glow particles (ambient) ----------
class Ambient {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = 1 + Math.random() * 2.5;
    this.speed = 0.15 + Math.random() * 0.35;
    this.alpha = 0.08 + Math.random() * 0.12;
    this.phase = Math.random() * Math.PI * 2;
  }
  update() {
    this.y -= this.speed;
    this.phase += 0.02;
    if (this.y < -10) {
      this.y = H + 10;
      this.x = Math.random() * W;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha * (0.7 + 0.3 * Math.sin(this.phase));
    ctx.fillStyle = '#3d7cff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- Card ----------
class Card {
  constructor(value, row, col) {
    this.value = Number(value);
    this.row = row;
    this.col = col;
    this.alive = true;
    this.selected = false;
    this.scale = 0.01;
    this.targetScale = 1;
    this.opacity = 0;
    this.targetOpacity = 1;
    this.x = 0; this.y = 0; this.w = 0; this.h = 0;
    this.pulse = 0;
  }

  updateLayout(boardX, boardY, cell, gap) {
    this.w = cell;
    this.h = cell;
    this.x = boardX + this.col * (cell + gap);
    this.y = boardY + this.row * (cell + gap);
  }

  contains(mx, my) {
    if (!this.alive || this.opacity < 0.75) return false;
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }

  update() {
    this.scale += (this.targetScale - this.scale) * 0.18;
    this.opacity += (this.targetOpacity - this.opacity) * 0.15;
    if (this.selected) this.pulse += 0.12;
  }

  draw(ctx) {
    if (!this.alive && this.opacity < 0.03) return;
    if (this.opacity < 0.03) return;

    const s = Math.max(0.05, this.scale);
    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2;
    const sw = this.w * s;
    const sh = this.h * s;
    const x = cx - sw / 2;
    const y = cy - sh / 2;
    const r = Math.max(4, 14 * s);

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, this.opacity));

    // Outer glow when selected
    if (this.selected && this.alive) {
      const glow = 14 + Math.sin(this.pulse) * 5;
      ctx.shadowColor = COLORS.accent;
      ctx.shadowBlur = glow;
    }

    // Card body
    const grad = ctx.createLinearGradient(x, y, x, y + sh);
    if (this.selected && this.alive) {
      grad.addColorStop(0, '#5b9aff');
      grad.addColorStop(1, '#2b5fd4');
    } else {
      grad.addColorStop(0, '#2a3142');
      grad.addColorStop(1, '#1a1f2b');
    }
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, sw, sh, r);
    ctx.fill();

    // Reset shadow before shine and text
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // Top shine
    const shine = ctx.createLinearGradient(x, y, x, y + sh * 0.5);
    shine.addColorStop(0, 'rgba(255,255,255,0.22)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    roundRect(ctx, x + 2, y + 2, sw - 4, sh * 0.42, r - 2);
    ctx.fill();

    // Number — always draw if there's any opacity
    ctx.fillStyle = COLORS.text;
    const fontSize = Math.max(16, Math.floor(24 * s));
    ctx.font = `bold ${fontSize}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 2;
    ctx.fillText(String(this.value), cx, cy + 1);

    // Final reset
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.restore();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- State ----------
let state = {
  cards: [],
  selected: [],
  score: 0,
  moves: 0,
  combo: 0,
  maxCombo: 0,
  remaining: 0,
  cols: 8,
  rows: 6,
  busy: false,
  particles: [],
  ambients: [],
  hintsLeft: 3,
  playerName: 'Игрок',
  difficulty: 'normal',
  lastMove: null   // для отмены хода
};

const DIFF = {
  easy:   { rows: 4, cols: 8, same: 0.55, hints: 4 },
  normal: { rows: 6, cols: 8, same: 0.40, hints: 3 },
  hard:   { rows: 6, cols: 10, same: 0.28, hints: 2 }
};

// ---------- Layout ----------
function getBoardLayout() {
  const pad = 18;
  const headerH = 78;
  const footerH = 100;
  const boardH = H - headerH - footerH;
  const gap = 7;

  const cellW = (W - pad * 2 - gap * (state.cols - 1)) / state.cols;
  const cellH = (boardH - gap * (state.rows - 1)) / state.rows;
  const cell = Math.min(cellW, cellH, 64);

  const totalW = cell * state.cols + gap * (state.cols - 1);
  const totalH = cell * state.rows + gap * (state.rows - 1);

  return {
    x: (W - totalW) / 2,
    y: headerH + (boardH - totalH) / 2,
    cell,
    gap
  };
}

// ---------- Game Logic ----------
function newGame() {
  const cfg = DIFF[state.difficulty];
  state.cols = cfg.cols;
  state.rows = cfg.rows;
  state.hintsLeft = cfg.hints;
  state.score = 0;
  state.moves = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.busy = false;
  state.selected = [];
  state.particles = [];
  state.lastMove = null;

  let total = state.rows * state.cols;
  if (total % 2) total--;

  const pool = [];
  for (let i = 0; i < total / 2; i++) {
    const a = 1 + Math.floor(Math.random() * 9);
    const b = Math.random() < cfg.same ? a : 10 - a;
    pool.push(a, b);
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  state.cards = [];
  let idx = 0;
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      if (idx < pool.length) {
        const card = new Card(pool[idx], r, c);
        // staggered appear
        setTimeout(() => {
          card.targetScale = 1;
          card.targetOpacity = 1;
        }, idx * 18);
        state.cards.push(card);
        idx++;
      }
    }
  }
  state.remaining = state.cards.length;
  updateUI();
  setStatus(`${state.playerName}, удачи!`);
}

function updateUI() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('moves').textContent = `Ходы: ${state.moves}`;
  document.getElementById('remain').textContent = `Ост: ${state.remaining}`;
  document.getElementById('combo').textContent = state.combo >= 2 ? `×${state.combo}` : '';
  document.getElementById('btn-hint').textContent =
    state.hintsLeft > 0 ? `Подсказка (${state.hintsLeft})` : 'Подсказка (−15)';
}

function setStatus(t) {
  document.getElementById('status').textContent = t;
}

function isPathClear(c1, c2) {
  if (c1 === c2) return false;
  if (c1.row === c2.row) {
    const a = Math.min(c1.col, c2.col), b = Math.max(c1.col, c2.col);
    for (let col = a + 1; col < b; col++)
      if (state.cards.some(c => c.alive && c.row === c1.row && c.col === col)) return false;
    return true;
  }
  if (c1.col === c2.col) {
    const a = Math.min(c1.row, c2.row), b = Math.max(c1.row, c2.row);
    for (let row = a + 1; row < b; row++)
      if (state.cards.some(c => c.alive && c.col === c1.col && c.row === row)) return false;
    return true;
  }
  const i1 = c1.row * state.cols + c1.col;
  const i2 = c2.row * state.cols + c2.col;
  const start = Math.min(i1, i2), end = Math.max(i1, i2);
  for (let i = start + 1; i < end; i++) {
    const r = Math.floor(i / state.cols), c = i % state.cols;
    if (state.cards.some(card => card.alive && card.row === r && card.col === c)) return false;
  }
  return true;
}

function canMatch(a, b) {
  return (a.value === b.value || a.value + b.value === 10) && isPathClear(a, b);
}

function checkPair() {
  if (state.selected.length !== 2) { state.busy = false; return; }
  const [c1, c2] = state.selected;

  if (canMatch(c1, c2)) {
    state.moves++;
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);

    const dist = Math.abs(c1.row - c2.row) + Math.abs(c1.col - c2.col);
    const points = Math.floor((12 + dist * 2) * (1 + (state.combo - 1) * 0.38));
    state.score += points;
    state.remaining -= 2;
    sfxSuccess();

    // Сохраняем ход для отмены
    state.lastMove = {
      c1, c2,
      points,
      prevCombo: state.combo - 1
    };

    setStatus(`+${points}` + (state.combo >= 2 ? `  ×${state.combo}` : ''));
    updateUI();

    const layout = getBoardLayout();
    c1.updateLayout(layout.x, layout.y, layout.cell, layout.gap);
    c2.updateLayout(layout.x, layout.y, layout.cell, layout.gap);

    spawnShatter(c1.x + c1.w/2, c1.y + c1.h/2, COLORS.accent);
    spawnShatter(c2.x + c2.w/2, c2.y + c2.h/2, COLORS.accent2);

    c1.alive = false;
    c2.alive = false;
    c1.targetScale = 0.1;
    c2.targetScale = 0.1;
    c1.targetOpacity = 0;
    c2.targetOpacity = 0;

    setTimeout(() => {
      state.selected = [];
      state.busy = false;
      if (state.remaining <= 0) {
        setStatus(`Победа!  ${state.score} очков`);
        saveRecord(state.playerName, state.score, state.difficulty);
      } else {
        setTimeout(() => setStatus('Отличный ход!'), 600);
      }
    }, 280);
  } else {
    state.combo = 0;
    updateUI();
    sfxError();
    setStatus('Нельзя убрать');
    c1.selected = false;
    c2.selected = false;
    state.selected = [];
    state.busy = false;
  }
}

// ---------- Input ----------
canvas.addEventListener('pointerdown', e => {
  if (state.busy) return;
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const layout = getBoardLayout();
  for (const card of state.cards) {
    card.updateLayout(layout.x, layout.y, layout.cell, layout.gap);
    if (card.contains(mx, my)) {
      if (state.selected.includes(card)) {
        card.selected = false;
        state.selected = state.selected.filter(c => c !== card);
        sfxClick();
      } else if (state.selected.length < 2) {
        card.selected = true;
        state.selected.push(card);
        sfxClick();
        if (state.selected.length === 2) {
          state.busy = true;
          setTimeout(checkPair, 160);
        }
      }
      break;
    }
  }
});

// ---------- Buttons ----------
document.getElementById('btn-hint').onclick = () => {
  if (state.busy) return;
  ensureAudio();
  if (state.hintsLeft <= 0) {
    if (state.score < 15) { setStatus('Не хватает очков'); return; }
    state.score -= 15;
  } else state.hintsLeft--;
  updateUI();
  sfxHint();

  for (let i = 0; i < state.cards.length; i++) {
    const a = state.cards[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < state.cards.length; j++) {
      const b = state.cards[j];
      if (!b.alive) continue;
      if (canMatch(a, b)) {
        a.selected = true;
        b.selected = true;
        setStatus('Подсказка');
        setTimeout(() => { a.selected = false; b.selected = false; }, 1700);
        return;
      }
    }
  }
  setStatus('Ходов нет — нажмите «Дописать»');
};

document.getElementById('btn-append').onclick = () => {
  if (state.busy || state.remaining === 0) return;
  const left = state.cards.filter(c => c.alive).map(c => c.value);
  if (!left.length) return;

  let newValues = [...left, ...left];
  for (let i = newValues.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newValues[i], newValues[j]] = [newValues[j], newValues[i]];
  }

  state.rows = Math.ceil(newValues.length / state.cols);
  state.cards = [];
  let idx = 0;
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      if (idx < newValues.length) {
        const card = new Card(newValues[idx], r, c);
        setTimeout(() => { card.targetScale = 1; card.targetOpacity = 1; }, idx * 12);
        state.cards.push(card);
        idx++;
      }
    }
  }
  state.remaining = state.cards.length;
  state.combo = 0;
  state.selected = [];
  updateUI();
  setStatus(`Дописано • ${state.rows}×${state.cols}`);
};


document.getElementById('btn-undo').onclick = () => {
  if (state.busy || !state.lastMove) {
    setStatus(state.lastMove ? 'Сейчас нельзя' : 'Нечего отменять');
    return;
  }
  const { c1, c2, points, prevCombo } = state.lastMove;

  // Возвращаем карточки
  c1.alive = true;
  c2.alive = true;
  c1.selected = false;
  c2.selected = false;
  c1.targetScale = 1;
  c2.targetScale = 1;
  c1.targetOpacity = 1;
  c2.targetOpacity = 1;
  c1.scale = 1;
  c2.scale = 1;
  c1.opacity = 1;
  c2.opacity = 1;

  state.score = Math.max(0, state.score - points);
  state.moves = Math.max(0, state.moves - 1);
  state.remaining += 2;
  state.combo = prevCombo;
  state.lastMove = null;
  state.selected = [];

  updateUI();
  setStatus('Ход отменён');
  sfxClick();
};

document.getElementById('btn-new').onclick = () => newGame();


// ---------- Records ----------
function loadRecords() {
  try {
    return JSON.parse(localStorage.getItem('semechki_records') || '[]');
  } catch(e) { return []; }
}

function saveRecord(name, score, difficulty) {
  if (score <= 0) return;
  const records = loadRecords();
  records.push({
    name: (name || 'Игрок').slice(0, 16),
    score,
    difficulty,
    date: new Date().toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})
  });
  records.sort((a,b) => b.score - a.score);
  localStorage.setItem('semechki_records', JSON.stringify(records.slice(0, 40)));
}

function showRecords() {
  const list = document.getElementById('records-list');
  const records = loadRecords();
  if (!records.length) {
    list.innerHTML = '<div style="text-align:center;color:#8b90a0;padding:20px;">Пока нет рекордов</div>';
  } else {
    list.innerHTML = records.slice(0, 25).map((r, i) => `
      <div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #2a2f42;">
        <span style="color:${i<3?'#3d7cff':'#eef0f5'}">${i+1}. ${r.name}</span>
        <span style="color:#3fd9a8;font-weight:700">${r.score}</span>
        <span style="color:#8b90a0;font-size:12px">${r.difficulty || ''}</span>
      </div>
    `).join('');
  }
  document.getElementById('records-modal').classList.remove('hidden');
  document.getElementById('records-modal').style.display = 'flex';
}

document.getElementById('btn-records').onclick = showRecords;
document.getElementById('btn-close-records').onclick = () => {
  document.getElementById('records-modal').classList.add('hidden');
  document.getElementById('records-modal').style.display = 'none';
};

// Save record on win
const originalSetStatus = setStatus;



// ---------- Start Menu ----------
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.difficulty = btn.dataset.diff;
  };
});

document.getElementById('btn-start').onclick = () => {
  ensureAudio();
  state.playerName = document.getElementById('player-name').value.trim() || 'Игрок';
  document.getElementById('start-menu').classList.add('hidden');
  // ambient particles
  state.ambients = Array.from({length: 35}, () => new Ambient());
  newGame();
};

// ---------- Render ----------
function loop() {
  // background
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);

  // subtle vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // ambient floating particles
  for (const a of state.ambients) {
    a.update();
    a.draw(ctx);
  }

  const layout = getBoardLayout();

  // cards
  for (const card of state.cards) {
    card.updateLayout(layout.x, layout.y, layout.cell, layout.gap);
    card.update();
    card.draw(ctx);
  }

  // shatter particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.update();
    p.draw(ctx);
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  requestAnimationFrame(loop);
}
loop();
</script>
